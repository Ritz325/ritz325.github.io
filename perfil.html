<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil · Study Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#5a3512;--ink-soft:#8a6a45;--cream:#fff6dc;--cream-2:#fdeab8;--gold:#f7b92b;--gold-deep:#d8921a;
      --orange:#ef7b24;--orange-deep:#b85618;--cyan:#0c91a3;--green:#4c9e50;--purple:#8751ca;--sea:#35b6f0;--sea-deep:#1683c9;
      font-family:"Baloo 2",system-ui,sans-serif;font-size:16px;color:var(--ink);font-synthesis:none
    }
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;background:linear-gradient(#8fdcff,var(--sea) 40%,var(--sea-deep));background-attachment:fixed}
    a{color:inherit}
    button,input,select{font:inherit}
    button,a,select,summary{touch-action:manipulation}
    :focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px var(--cyan)}

    /* Marco de escritorio: 1280px */
    .screen{width:min(100%,1280px);min-height:100vh;margin:0 auto;background:var(--cream);box-shadow:0 0 0 4px var(--orange-deep),0 0 60px rgba(0,0,0,.25)}

    /* 1 · HUD superior */
    .hud{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;height:68px;padding:0 32px;background:var(--orange);border-bottom:5px solid var(--orange-deep);color:#fff}
    .level-ring{width:54px;height:54px;flex:none;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--xp,0)*1%),#fff3 0);position:relative}
    .level-ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--orange-deep)}
    .level-ring span{position:relative;display:grid;line-height:.9;text-align:center;color:var(--ink);font-weight:800;font-size:20px}
    .level-ring small{font-size:11px;color:var(--ink-soft)}
    .pill{width:220px;display:flex;align-items:center;justify-content:space-between;gap:8px;height:38px;padding:0 6px 0 16px;border-radius:99px;background:#7a3f12;box-shadow:inset 0 2px 0 #0003;font-weight:800;font-size:16px;white-space:nowrap}
    .pill i{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--gold);color:var(--ink);font-style:normal;font-size:14px}
    .hud-spacer{flex:1}
    .hud-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:#7a3f12;color:#fff;font-size:20px;text-decoration:none;cursor:pointer}
    .hud-btn:hover{background:#94501b}

    /* 2 · Banner de título */
    .banner{position:relative;width:560px;margin:28px auto 0;padding:14px 24px;text-align:center;background:#fffdf3;border:4px solid #ecd9a4;border-radius:20px;box-shadow:0 5px 0 #e0c77f}
    .banner::before,.banner::after{content:"";position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--gold)}
    .banner::before{left:14px}.banner::after{right:14px}
    .banner h1{margin:0;font-size:38px;line-height:1.05;color:var(--ink);overflow-wrap:anywhere}
    .banner p{margin:4px 0 0;font-size:17px;font-weight:700;color:var(--orange-deep);overflow-wrap:anywhere}

    /* 3 · Isla del mentor + panel de progreso */
    .stage{display:grid;grid-template-columns:420px 1fr;gap:56px;align-items:center;justify-content:center;width:1000px;max-width:100%;margin:0 auto;padding:32px 32px 40px}
    .island{display:grid;justify-items:center;gap:14px}
    .island-ground{position:relative;width:320px;height:300px;display:grid;place-items:center}
    .island-ground::before{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;border-radius:50%;background:linear-gradient(#7fcf6a,#4c9e50);border-bottom:14px solid #7a4a22;box-shadow:0 8px 0 #5e3a19}
    .avatar{position:relative;width:220px;height:220px;margin-bottom:46px;background:#eaf6ff center/contain no-repeat;border:5px solid #fff;border-radius:28px;box-shadow:0 6px 0 var(--orange-deep)}
    .avatar.zorro-spark{background-color:#091c4b;background-image:url("imagen_oficial_zorro_spark.jpg");background-blend-mode:screen}
    .avatar.panda-zen{background-image:url("imagen_oficial_panda_zen.jpg")}
    .avatar.gata-luna{background-image:url("imagen_oficial_gata_luna.jpg")}
    .avatar.tortuga-sage{background-image:url("imagen_oficial_tortuga_sage.jpg")}
    .mentor-name{margin:0;padding:4px 18px;border-radius:99px;background:var(--cream-2);border:2px solid #ecd9a4;font-weight:800;font-size:18px}
    .tabs{display:flex;border:3px solid var(--orange-deep);border-radius:12px;overflow:hidden}
    .tabs button{width:60px;height:40px;border:0;background:#e9c27c;font-size:20px;cursor:pointer}
    .tabs button[aria-selected="true"]{background:var(--gold)}

    .step-card{padding:22px 24px;background:#fff9e6;border:5px solid var(--gold);border-radius:24px;box-shadow:0 0 0 3px #fff inset,0 6px 0 var(--gold-deep)}
    .step-head{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:20px}
    .segments{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 18px}
    .segments span{height:18px;border-radius:6px;background:#d9d3c2}
    .segments span.on{background:linear-gradient(#ffe066,#ffbb1f)}
    .checklist{display:grid;gap:10px;padding:16px 18px;margin:0 0 18px;list-style:none;background:#eee8d6;border-radius:16px;font-weight:800;font-size:17px}
    .checklist li{display:flex;align-items:center;gap:12px}
    .tick{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;background:#fff;border:2px solid #cfc8b2;color:transparent;font-size:14px}
    .tick.ok{background:#1db7c4;border-color:#1db7c4;color:#fff}
    .go{display:block;padding:12px;text-align:center;font-size:20px;border-radius:14px;background:linear-gradient(#ffa64d,var(--orange));box-shadow:0 5px 0 var(--orange-deep);color:#fff;font-weight:800;text-decoration:none}
    .go:hover{filter:brightness(1.06)}

    .divider{height:16px;background:repeating-linear-gradient(-45deg,#fff6dc 0 12px,#f3dfae 12px 24px)}

    /* 4 · Zona dorada */
    .gold{padding:32px 48px 48px;background:linear-gradient(#f9c23c,#f2ab1c);min-height:420px}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
    .section-title h2{margin:0;color:#7a4306;font-size:30px;text-shadow:0 2px 0 #ffe9a8}
    .chip{padding:5px 18px;border-radius:99px;background:#fff6dc;border:2px solid #fff;box-shadow:0 3px 0 var(--gold-deep);font-weight:800;font-size:15px;color:var(--ink)}

    .collection{display:grid;grid-template-columns:repeat(4,200px);justify-content:space-between;gap:16px;margin-bottom:16px}
    .card{display:grid;gap:6px;padding:8px 8px 10px;text-align:left;background:#fff;border:4px solid #fff;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.18);color:var(--ink);cursor:pointer}
    .card:hover{transform:translateY(-2px)}
    .card[aria-pressed="true"]{border-color:#ffe23a;box-shadow:0 0 0 4px #ffe23a66,0 4px 0 rgba(0,0,0,.18)}
    .card .thumb{height:150px;background:#d9d3c2 center/contain no-repeat;border-radius:10px}
    .card .thumb.zorro-spark{background-color:#091c4b;background-image:url("imagen_oficial_zorro_spark.jpg");background-blend-mode:screen}
    .card .thumb.panda-zen{background-image:url("imagen_oficial_panda_zen.jpg")}
    .card .thumb.gata-luna{background-image:url("imagen_oficial_gata_luna.jpg")}
    .card .thumb.tortuga-sage{background-image:url("imagen_oficial_tortuga_sage.jpg")}
    .card strong{font-size:18px;line-height:1}
    .card small{display:flex;justify-content:space-between;border-top:1px dashed #d8d0bd;padding-top:5px;font-size:13px;font-weight:800;color:var(--ink-soft)}
    .save-row{display:flex;justify-content:flex-end;margin-bottom:28px}
    .btn{min-height:44px;padding:8px 22px;border:0;border-radius:12px;background:var(--cyan);box-shadow:0 4px 0 #087281;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
    .btn:hover{background:#10a8b8}

    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
    .stat{min-height:104px;display:flex;flex-direction:column;justify-content:center;padding:14px 18px;border:4px solid #fff;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
    .stat strong{font-size:32px;line-height:1}
    .stat span{margin-top:6px;font-size:15px;font-weight:800;color:var(--ink)}
    .stat.cyan{background:#dff8ff;color:#087e98}.stat.orange{background:#ffedda;color:#b5551c}.stat.green{background:#dff1dc;color:#357a39}.stat.purple{background:#e8e0ff;color:#7542b7}

    .lower-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
    .col{display:grid;gap:24px}
    .panel{padding:20px 22px;background:#fffdf3;border:4px solid #fff;border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
    .panel h2{margin:0 0 14px;font-size:20px;color:var(--ink)}
    .chart{height:170px;display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:12px;border-bottom:2px solid #d9cfa9}
    .chart-day{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:6px;font-size:14px;font-weight:800}
    .chart-bar{width:36px;height:10px;background:#cdebf1;border:1px solid #8ccdd4;border-radius:4px 4px 0 0}
    .chart-note{margin:10px 0 0;text-align:center;font-size:14px;color:var(--ink-soft)}
    .achievement-list{display:flex;flex-wrap:wrap;gap:10px}
    .achievement{padding:9px 15px;border:2px solid;border-radius:14px;font-size:15px;font-weight:800}
    .achievement.orange{background:#ffead9;border-color:#f5b17b;color:#d65d1d}
    .achievement.cyan{background:#c9eef1;border-color:#8ccdd4;color:#087e98}
    .achievement.purple{background:#e8def7;border-color:#c4a8e7;color:#7542b7}

    .settings{display:grid;gap:8px}
    .setting{border:1px solid #eadfb9;border-radius:12px;background:#fff;padding:0 14px}
    .setting summary{display:flex;align-items:center;justify-content:space-between;min-height:48px;font-weight:800;font-size:16px;cursor:pointer;list-style:none}
    .setting summary::-webkit-details-marker{display:none}
    .setting summary::after{content:"▾"}
    .setting[open] summary::after{content:"▴"}
    .setting-body{padding:2px 0 16px;font-size:15px;color:var(--ink-soft)}
    .setting-body label{display:block;margin:0 0 4px;font-weight:800}
    .setting-body input:not([type=checkbox]),.setting-body select{width:100%;min-height:44px;margin-bottom:8px;padding:6px 10px;border:2px solid #efe0b0;border-radius:10px;background:#fff;color:var(--ink)}
    .setting-body .inline-control{display:flex;align-items:center;justify-content:space-between}
    .setting-body input[type=checkbox]{width:22px;height:22px;accent-color:var(--cyan)}
    .setting-body .btn{margin-top:6px}

    .empty{margin:60px auto;width:520px;max-width:calc(100% - 32px);padding:32px;text-align:center;background:linear-gradient(120deg,#fff3d6,#dff8ff);border:4px solid #d9b98a;border-radius:20px;box-shadow:0 7px 0 #6b3d1c}
    .empty a{display:inline-block;margin-top:12px;padding:10px 20px;border-radius:12px;background:var(--orange);box-shadow:0 4px 0 var(--orange-deep);color:#fff;font-weight:800;text-decoration:none}

    /* Pantallas menores a 1100px */
    @media(max-width:1100px){
      .hud{padding:0 20px}.banner{width:calc(100% - 40px)}
      .stage{grid-template-columns:1fr;width:560px;gap:28px}
      .gold{padding:28px 24px 40px}
      .collection{grid-template-columns:repeat(2,1fr)}
      .stats{grid-template-columns:repeat(2,1fr)}
      .lower-grid{grid-template-columns:1fr}
    }
    @media(max-width:600px){.pill{width:auto;flex:1}.hud-spacer{display:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="screen" id="profileContent"></div>
  <script>
    const content = document.getElementById("profileContent");
    let user = null;
    try { user = JSON.parse(localStorage.getItem("studyPlayUser") || "null"); } catch { user = null; }

    if (!user || !user.nombre) {
      content.innerHTML = '<section class="empty"><h1>Sin sesión activa</h1><p>Inicia sesión para ver tu perfil.</p><a href="login.html">Iniciar sesión</a></section>';
    } else {
      const level = Number(user.nivel) || 1;
      const xp = Math.min(100, Math.max(0, Number(user.xp) || 0));
      const streak = Math.max(0, Number(user.racha) || 0);
      const filled = Math.floor(xp / 20);
      const mentors = { "panda-zen": "Panda Zen", "zorro-spark": "Zorro Spark", "gata-luna": "Gata Luna", "tortuga-sage": "Tortuga Sage" };
      let pickedMentor = mentors[user.mentorId] ? user.mentorId : "";

      content.innerHTML = `
        <header class="hud">
          <div class="level-ring" style="--xp:${xp}" role="img" aria-label="Nivel ${level}, ${xp} de 100 XP"><span><small>Nv</small>${level}</span></div>
          <div class="pill" aria-label="Racha"><span>🔥 ${streak} días</span><i aria-hidden="true">★</i></div>
          <div class="pill" aria-label="Experiencia"><span>${xp} / 100 XP</span><i aria-hidden="true">⚡</i></div>
          <span class="hud-spacer"></span>
          <a class="hud-btn" href="index.html" aria-label="Volver al mapa" title="Volver al mapa">🗺️</a>
          <button class="hud-btn" type="button" id="gear" aria-label="Ir a configuración" title="Configuración">⚙️</button>
        </header>

        <div class="banner">
          <h1>¡Hola, <span data-profile-name></span>!</h1>
          <p data-profile-email></p>
        </div>

        <section class="stage" aria-label="Tu mentor y progreso">
          <div class="island">
            <div class="island-ground"><span class="avatar" id="mainAvatar" role="img"></span></div>
            <p class="mentor-name" data-mentor-name></p>
            <div class="tabs" role="tablist" aria-label="Vista">
              <button type="button" role="tab" aria-selected="true" aria-label="Mentor" data-tab="mentor">👤</button>
              <button type="button" role="tab" aria-selected="false" aria-label="Progreso" data-tab="progress">📊</button>
            </div>
          </div>
          <div class="step-card">
            <div class="step-head"><span>NIVEL ${level}</span><span>${xp}/100 XP</span></div>
            <div class="segments" role="progressbar" aria-label="Experiencia del nivel" aria-valuenow="${xp}" aria-valuemin="0" aria-valuemax="100">
              ${[0,1,2,3,4].map(i => `<span class="${i < filled ? "on" : ""}"></span>`).join("")}
            </div>
            <ul class="checklist">
              <li><span class="tick ${level > 1 ? "ok" : ""}">✓</span>Nivel ${level}</li>
              <li><span class="tick ${streak > 0 ? "ok" : ""}">✓</span>Racha: ${streak} días</li>
              <li><span class="tick ${xp >= 100 ? "ok" : ""}">✓</span>${100 - xp} XP para subir</li>
            </ul>
            <a class="go" href="index.html">Seguir aventura</a>
          </div>
        </section>

        <div class="divider"></div>

        <main class="gold">
          <div class="section-title"><h2>Mis mentores</h2><span class="chip">Elige uno</span></div>
          <div class="collection" id="collection">
            ${Object.entries(mentors).map(([id, name]) => `
              <button type="button" class="card" data-mentor="${id}" aria-pressed="${id === pickedMentor}">
                <span class="thumb ${id}" role="img" aria-label="${name}"></span>
                <strong>${name}</strong>
                <small><span>${id === pickedMentor ? "Activo" : "Disponible"}</span><span>Nv ${level}</span></small>
              </button>`).join("")}
          </div>
          <div class="save-row"><button type="button" class="btn" id="saveMentor">Guardar mentor</button></div>

          <div class="stats" aria-label="Estadísticas principales">
            <div class="stat cyan"><strong>--</strong><span>Horas totales</span></div>
            <div class="stat orange"><strong>${streak} días</strong><span>Racha actual</span></div>
            <div class="stat green"><strong>--</strong><span>Tareas completadas</span></div>
            <div class="stat purple"><strong>--</strong><span>Materia favorita</span></div>
          </div>

          <div class="lower-grid"><div class="col">
          <section class="panel" id="progressPanel" aria-labelledby="studyTitle">
            <h2 id="studyTitle">📊 Horas de estudio — esta semana</h2>
            <div class="chart" role="img" aria-label="Gráfico semanal sin datos registrados">
              ${["L","M","X","J","V","S","D"].map(d => `<div class="chart-day"><span class="chart-bar"></span><span>${d}</span></div>`).join("")}
            </div>
            <p class="chart-note">El registro de actividad semanal aún no está disponible.</p>
          </section>

          <section class="panel" aria-labelledby="achievementsTitle">
            <h2 id="achievementsTitle">🏆 Logros recientes</h2>
            <div class="achievement-list"><span class="achievement orange">Aún no hay logros</span><span class="achievement cyan">Sigue explorando el mapa</span><span class="achievement purple">Tu aventura comienza aquí</span></div>
          </section>
          </div>

          <section class="panel" id="settingsPanel" aria-labelledby="settingsTitle">
            <h2 id="settingsTitle">⚙️ Configuración</h2>
            <div class="settings">
              <details class="setting"><summary>👤 Editar perfil</summary><div class="setting-body"><label for="editName">Nombre</label><input id="editName" maxlength="32"><label for="editEmail">Correo electrónico</label><input id="editEmail" type="email"><button type="button" class="btn" id="saveProfile">Guardar cambios</button></div></details>
              <details class="setting"><summary>🔒 Cambiar contraseña</summary><div class="setting-body">La contraseña no se almacena en esta demo. Conecta un servicio de autenticación para habilitar esta opción.</div></details>
              <details class="setting"><summary>🌐 Idioma</summary><div class="setting-body"><label for="language">Idioma de la interfaz</label><select id="language"><option>Español</option></select></div></details>
              <details class="setting"><summary>🔔 Notificaciones</summary><div class="setting-body"><label class="inline-control" for="notifications">Recordatorios de estudio<input id="notifications" type="checkbox"></label></div></details>
              <details class="setting"><summary>🎨 Tema visual</summary><div class="setting-body"><label for="theme">Tema</label><select id="theme"><option value="map">Aventura del mapa</option></select></div></details>
              <details class="setting"><summary>🚪 Cerrar sesión</summary><div class="setting-body">Se cerrará la sesión de este navegador.<br><button type="button" class="btn" id="signOut">Cerrar sesión</button></div></details>
            </div>
          </section>
          </div>
        </main>`;

      const q = s => content.querySelector(s);
      q("[data-profile-name]").textContent = user.nombre;
      q("[data-profile-email]").textContent = user.email || "Correo no registrado";
      q("[data-mentor-name]").textContent = "🐾 " + (user.mentorName || "Sin mentor");
      q("#editName").value = user.nombre;
      q("#editEmail").value = user.email || "";
      q("#notifications").checked = localStorage.getItem("studyPlayNotifications") === "true";

      const avatar = q("#mainAvatar");
      const setAvatar = id => {
        avatar.className = "avatar" + (mentors[id] ? " " + id : "");
        avatar.setAttribute("aria-label", mentors[id] ? `Mentor virtual: ${mentors[id]}` : "Espacio reservado para la imagen del mentor");
      };
      setAvatar(pickedMentor);

      content.querySelectorAll(".card").forEach(card => card.addEventListener("click", () => {
        pickedMentor = card.dataset.mentor;
        content.querySelectorAll(".card").forEach(c => c.setAttribute("aria-pressed", String(c === card)));
        setAvatar(pickedMentor);
        q("[data-mentor-name]").textContent = "🐾 " + mentors[pickedMentor];
      }));

      content.querySelectorAll(".tabs button").forEach(btn => btn.addEventListener("click", () => {
        content.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
        const target = btn.dataset.tab === "progress" ? q("#progressPanel") : q("#collection");
        target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "center" });
      }));

      q("#gear").addEventListener("click", () => {
        const panel = q("#settingsPanel");
        panel.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" });
        panel.querySelector("summary").focus({ preventScroll: true });
      });

      q("#saveProfile").addEventListener("click", () => {
        const updatedName = q("#editName").value.trim();
        const updatedEmail = q("#editEmail").value.trim();
        if (!updatedName || !q("#editEmail").checkValidity()) { q("#editName").focus(); return; }
        const updatedUser = { ...user, nombre: updatedName, email: updatedEmail };
        if (user.email && user.email.toLowerCase() !== updatedEmail.toLowerCase()) {
          const accounts = JSON.parse(localStorage.getItem("studyPlayAccounts") || "{}");
          delete accounts[user.email.toLowerCase()];
          accounts[updatedEmail.toLowerCase()] = updatedUser;
          localStorage.setItem("studyPlayAccounts", JSON.stringify(accounts));
        }
        localStorage.setItem("studyPlayUser", JSON.stringify(updatedUser));
        location.reload();
      });
      q("#notifications").addEventListener("change", e => localStorage.setItem("studyPlayNotifications", String(e.target.checked)));
      q("#saveMentor").addEventListener("click", () => {
        if (!pickedMentor) return;
        const updatedUser = { ...user, mentorId: pickedMentor, mentorName: mentors[pickedMentor] };
        localStorage.setItem("studyPlayUser", JSON.stringify(updatedUser));
        if (user.email) {
          const accounts = JSON.parse(localStorage.getItem("studyPlayAccounts") || "{}");
          accounts[user.email.toLowerCase()] = updatedUser;
          localStorage.setItem("studyPlayAccounts", JSON.stringify(accounts));
        }
        location.reload();
      });
      q("#signOut").addEventListener("click", () => {
        localStorage.removeItem("studyPlayUser");
        location.href = "index.html";
      });
    }
  </script>
</body>
</html>
