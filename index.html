<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Play · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#38b6f0; --sea:#0e7fc4; --grass:#4fb23f; --wood:#8a5a2b; --paper:#fff8e7;
  --red:#e0483f; --blue:#2d63d8; --green:#2f9e44; --sun:#ffc933; --ink:#2b2118;
  --fox:#ef7b24; --fox-light:#fff0d2;
  --c:var(--sea);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#bfe8ff,#7fd0f7 60%,#38b6f0) fixed;min-height:100vh;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:16px}

/* Barra del jugador */
.player{display:flex;align-items:center;gap:14px;background:var(--paper);border:4px solid var(--wood);border-radius:22px;padding:10px 16px;box-shadow:0 6px 0 rgba(90,55,20,.35)}
.avatar{width:56px;height:56px;border-radius:50%;background:#ff9a3c;display:grid;place-items:center;font-size:32px;border:3px solid var(--wood);flex:none}
.player h1{font-size:1.3rem;margin:0;line-height:1.1}
.player small{color:#6b5640;font-size:.95rem}
.xp{flex:1;min-width:120px}
.bar{height:14px;background:#e9dcbc;border-radius:99px;overflow:hidden;border:2px solid var(--wood)}
.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .8s ease}
.streak{font-weight:800;background:var(--sun);border:3px solid var(--wood);border-radius:99px;padding:2px 12px;white-space:nowrap}

/* Mapa */
body{background:#0e7fc4;overflow:hidden}
.wrap.full{padding:0;max-width:none}
.topbar{
  position:fixed;z-index:5;top:env(safe-area-inset-top,0px);left:0;right:0;height:60px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:6px 18px;background:var(--fox);border-bottom:4px solid var(--wood);
  box-shadow:0 4px 0 rgba(43,33,24,.2)
}
.brand{display:flex;align-items:center;gap:8px;color:#fff8e7;text-decoration:none;font-size:1.08rem;font-weight:800;white-space:nowrap}
.brand-icon,.profile-avatar{display:block;flex:none;background-color:#091c4b;background-size:contain;background-position:center;background-repeat:no-repeat;border:2px solid var(--fox-light);border-radius:10px}
.brand-icon{width:38px;height:38px;background-color:#091c4b;background-image:url("imagen_oficial_zorro_spark.jpg");background-blend-mode:screen}
.profile-avatar{width:32px;height:32px;background-color:#f3f6f6;border-color:#9bb3ba}
.profile-avatar.zorro-spark{background-color:#091c4b;background-blend-mode:screen;border-color:#fff0d2}
.nav-account{display:flex;align-items:center}
.login-link,.profile-trigger{min-height:40px;display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 11px;color:var(--ink);background:var(--fox-light);border:3px solid var(--wood);border-radius:13px;text-decoration:none;font:inherit;font-weight:800;box-shadow:0 3px 0 rgba(43,33,24,.2)}
.login-link:hover,.profile-trigger:hover{background:#fff8e7}
.login-link:active,.profile-trigger:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(43,33,24,.2)}
.profile-menu{position:relative}
.profile-menu summary{list-style:none;cursor:pointer}
.profile-menu summary::-webkit-details-marker{display:none}
.profile-trigger{width:44px;height:44px;padding:3px}
.profile-panel{position:absolute;top:calc(100% + 12px);right:0;width:220px;padding:12px;background:var(--fox-light);border:3px solid var(--wood);border-radius:12px;box-shadow:0 6px 0 rgba(43,33,24,.22)}
.profile-panel p{margin:0 0 8px;font-weight:800}
.profile-panel a,.profile-panel button{width:100%;display:block;padding:7px 9px;color:var(--ink);background:#fff8e7;border:2px solid var(--wood);border-radius:8px;text-align:left;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}
.profile-panel button{margin-top:7px;background:#f8d7c0}
.map{position:fixed;isolation:isolate;top:calc(env(safe-area-inset-top,0px) + 60px);right:0;bottom:0;left:0;width:100%;height:calc(100vh - 60px - env(safe-area-inset-top,0px));height:calc(100dvh - 60px - env(safe-area-inset-top,0px));overflow:hidden;background:#0e7fc4}
.map::before{content:"";display:block;position:absolute;z-index:-1;inset:-16px;background-image:var(--map-background);background-size:cover;background-position:center;filter:blur(10px) brightness(.72);transform:scale(1.04)}
.map img{position:absolute;z-index:1;inset:0;width:100%;height:100%;display:block;object-fit:contain;object-position:center}
.spot{position:absolute;z-index:2;transform:translate(-50%,-50%);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-decoration:none}
.orb{--p:0;width:clamp(64px,11vw,104px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.85) 0);box-shadow:0 0 0 4px #fff,0 8px 18px rgba(0,40,80,.45);transition:transform .2s}
.orb b{width:76%;aspect-ratio:1;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:clamp(1.6rem,4.5vw,2.8rem);font-weight:400;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.spot:hover .orb,.spot:focus-visible .orb{transform:scale(1.14)}
.spot:active .orb{transform:scale(.96)}
.spot em{font-style:normal;font-weight:800;font-size:clamp(.8rem,1.9vw,1.15rem);background:rgba(20,40,60,.72);border-radius:99px;padding:1px 12px;white-space:nowrap;backdrop-filter:blur(3px)}
.spot::before{content:"";position:absolute;top:0;left:50%;width:clamp(64px,11vw,104px);aspect-ratio:1;translate:-50% 0;border-radius:50%;border:3px solid var(--c);animation:ping 2.4s ease-out infinite;pointer-events:none}
.spot:nth-of-type(2)::before{animation-delay:-.8s}.spot:nth-of-type(3)::before{animation-delay:-1.6s}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}

@media (max-width:760px){
  .map{top:calc(env(safe-area-inset-top,0px) + 54px);height:calc(100vh - 54px - env(safe-area-inset-top,0px));height:calc(100dvh - 54px - env(safe-area-inset-top,0px))}
  .topbar{height:54px;padding:5px 12px}
  .brand{font-size:.98rem}
  .brand-icon{width:34px;height:34px}
  .profile-trigger{width:40px;height:40px}
  .login-link{min-height:38px;padding:4px 9px;font-size:.92rem}
}

@media (prefers-reduced-motion:reduce){.spot::before{animation:none}.bar i{transition:none}}
</style>
</head>

<script>
const materias = {
  espanol: {
    nombre: "Español", icono: "📖", color: "#e0483f", x: 40, y: 32,
    progreso: 72, nivel: 5, actividades: 34, promedio: 8.6, tiempo: "12 h",
    temas: [["Comprensión lectora", 90], ["Ortografía", 75], ["Gramática", 60], ["Redacción", 55]],
    insignias: [["📚 Lectora", true], ["✍️ Escritora", true], ["🏆 Sin faltas", false]],
    reciente: [["Lectura: El principito", "9.0"], ["Dictado #4", "8.5"], ["Uso de la coma", "7.8"]]
  },
  matematicas: {
    nombre: "Matemáticas", icono: "🔢", color: "#2d63d8", x: 67, y: 42,
    progreso: 55, nivel: 4, actividades: 28, promedio: 7.9, tiempo: "9 h",
    temas: [["Suma y resta", 95], ["Multiplicación", 70], ["Fracciones", 40], ["Geometría", 30]],
    insignias: [["➕ Sumador", true], ["📐 Geómetra", false], ["🧮 Veloz", true]],
    reciente: [["Tablas del 7", "9.5"], ["Fracciones básicas", "6.5"], ["Problemas de dinero", "8.0"]]
  },
  ciencias: {
    nombre: "Ciencias Naturales", icono: "🌱", color: "#2f9e44", x: 50, y: 71,
    progreso: 40, nivel: 3, actividades: 19, promedio: 8.2, tiempo: "6 h",
    temas: [["Seres vivos", 80], ["Plantas", 55], ["Ciclo del agua", 30], ["Cuerpo humano", 10]],
    insignias: [["🔍 Curioso", true], ["🌿 Botánico", false], ["💧 Hidrólogo", false]],
    reciente: [["Partes de la planta", "8.8"], ["Hábitats", "7.5"], ["Quiz: animales", "8.4"]]
  }
};

/* ====== DASHBOARD ====== */
const $ = id => document.getElementById(id);
const mapImage = $("mapImg");
mapImage.src = "mapa-pc.png.jpg";
$("map").style.setProperty("--map-background", `url("${mapImage.src}")`);

function getCurrentUser() {
  try {
    return JSON.parse(localStorage.getItem("studyPlayUser") || "null");
  } catch {
    return null;
  }
}

function renderAccount() {
  const account = $("navAccount");
  const currentUser = getCurrentUser();
  account.replaceChildren();

  if (!currentUser || !currentUser.nombre) {
    const loginLink = document.createElement("a");
    loginLink.className = "login-link";
    loginLink.href = "login.html";
    loginLink.textContent = "Iniciar sesión";
    account.appendChild(loginLink);
    return;
  }

  const menu = document.createElement("details");
  menu.className = "profile-menu";
  const trigger = document.createElement("summary");
  trigger.className = "profile-trigger";
  trigger.setAttribute("aria-label", `Perfil de ${currentUser.nombre}, mentor ${currentUser.mentorName || "sin elegir"}`);
  const profileAvatar = document.createElement("span");
  profileAvatar.className = "profile-avatar";
  profileAvatar.setAttribute("aria-hidden", "true");
  if (currentUser.mentorId === "zorro-spark") {
    profileAvatar.classList.add("zorro-spark");
    profileAvatar.style.backgroundImage = 'url("imagen_oficial_zorro_spark.jpg")';
  }
  trigger.appendChild(profileAvatar);

  const panel = document.createElement("div");
  panel.className = "profile-panel";
  const greeting = document.createElement("p");
  greeting.textContent = `${currentUser.nombre} · ${currentUser.mentorName || "Sin mentor"}`;
  const profileLink = document.createElement("a");
  profileLink.href = "perfil.html";
  profileLink.textContent = "Ver perfil";
  const signOut = document.createElement("button");
  signOut.type = "button";
  signOut.textContent = "Cerrar sesión";
  signOut.addEventListener("click", () => {
    localStorage.removeItem("studyPlayUser");
    renderAccount();
  });

  panel.append(greeting, profileLink, signOut);
  menu.append(trigger, panel);
  account.appendChild(menu);
}

renderAccount();
window.addEventListener("storage", renderAccount);

function positionSpots() {
  if (!mapImage.naturalWidth || !mapImage.naturalHeight) return;
  const bounds = $("map").getBoundingClientRect();
  const scale = Math.min(bounds.width / mapImage.naturalWidth, bounds.height / mapImage.naturalHeight);
  const imageWidth = mapImage.naturalWidth * scale;
  const imageHeight = mapImage.naturalHeight * scale;
  const offsetX = (bounds.width - imageWidth) / 2;
  const offsetY = (bounds.height - imageHeight) / 2;

  document.querySelectorAll(".spot").forEach(spot => {
    spot.style.left = `${Number(spot.dataset.x) / 100 * imageWidth + offsetX}px`;
    spot.style.top = `${Number(spot.dataset.y) / 100 * imageHeight + offsetY}px`;
  });
}

Object.entries(materias).forEach(([id, m]) => {
  const spot = document.createElement("a");
  spot.className = "spot";
  spot.href = id === "matematicas" ? "matematicas.html" : "materia.html?id=" + id;
  spot.dataset.x = m.x;
  spot.dataset.y = m.y + 4;
  spot.style.setProperty("--c", m.color);
  spot.setAttribute("aria-label", `Abrir ${m.nombre}, progreso ${m.progreso}%`);
  spot.innerHTML = `<span class="orb" style="--p:${m.progreso}"><b>${m.icono}</b></span><em>${m.nombre}</em>`;
  $("map").appendChild(spot);
});
mapImage.addEventListener("load", positionSpots);
window.addEventListener("resize", positionSpots);
positionSpots();

</script>
