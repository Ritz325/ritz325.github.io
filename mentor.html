<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elige tu mentor · Study Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:"Baloo 2",system-ui,sans-serif;color:#294654;background:#edf8f2;font-synthesis:none}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;grid-template-rows:60px 1fr;background:radial-gradient(ellipse at 8% 95%,rgba(255,201,51,.24),transparent 34%),radial-gradient(ellipse at 93% 10%,rgba(79,178,63,.1),transparent 30%),linear-gradient(145deg,#edf8f2,#fbf5e7 72%,#f6edda)}
    a{color:inherit}
    :focus-visible{outline:3px solid #ffc933;outline-offset:3px}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 22px;background:#ef7b24;border-bottom:4px solid #8a5a2b;color:#fff8e7}
    .brand{display:flex;align-items:center;gap:9px;color:inherit;text-decoration:none;font-size:1.08rem;font-weight:800}
    .fox{width:42px;height:42px;display:block;flex:none;background:#091c4b url("imagen_oficial_zorro_spark.jpg") center/contain no-repeat;border:2px solid #fff0d2;border-radius:10px}
    .back{padding:7px 11px;border:2px solid rgba(255,248,231,.7);border-radius:10px;font-weight:800;text-decoration:none}
    main{display:grid;place-items:center;padding:24px}
    .mentor-panel{width:min(100%,940px);padding:clamp(22px,4vw,48px);background:#dff8ff;border:4px solid #4b7180;border-radius:4px;box-shadow:0 8px 0 rgba(43,33,24,.18)}
    .heading{text-align:center;margin-bottom:24px}
    h1{margin:0;color:#294654;font-size:clamp(1.8rem,3.5vw,2.5rem);line-height:1.1}
    .intro{margin:6px 0 0;color:#527887;font-weight:700}
    .mentor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .mentor-option{position:relative;min-width:0;cursor:pointer}
    .mentor-option input{position:absolute;width:1px;height:1px;opacity:0}
    .mentor-card{min-height:110px;display:grid;grid-template-columns:76px minmax(0,1fr) 20px;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,.5);border:1px solid #c6dee2;border-radius:12px;box-shadow:0 3px 0 rgba(43,76,87,.1);transition:border-color .16s,background .16s,transform .16s}
    .mentor-option:hover .mentor-card{transform:translateY(-2px);background:#fff}
    .mentor-option input:checked+.mentor-card{border:2px solid #0c91a3;background:#fff;box-shadow:0 4px 0 rgba(12,145,163,.18)}
    .mentor-option input:focus-visible+.mentor-card{outline:3px solid #ffc933;outline-offset:3px}
    .mentor-image{width:72px;height:72px;display:grid;place-items:center;overflow:hidden;background:#f1f8f8;border:1px dashed #b7cfd3;border-radius:10px}
    .mentor-image img{width:100%;height:100%;object-fit:contain}
    .mentor-copy{min-width:0}
    .mentor-copy h2{margin:0 0 3px;font-size:1.2rem;line-height:1.05}
    .mentor-copy p{margin:0;color:#577785;font-size:.88rem;font-weight:700;line-height:1.2}
    .mentor-panda h2{color:#0096a8}.mentor-fox h2{color:#ef7b24}.mentor-cat h2{color:#77b833}.mentor-turtle h2{color:#ef6374}
    .choice-indicator{width:18px;height:18px;border:2px solid #b8c6c8;border-radius:50%;background:#fff}
    .mentor-option input:checked+.mentor-card .choice-indicator{border:5px solid #0c91a3}
    .confirm{display:block;min-width:min(100%,290px);min-height:48px;margin:20px auto 0;padding:8px 18px;border:0;border-radius:8px;background:#101847;color:#fff;font:inherit;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #080e31}
    .confirm:hover{background:#202c66}
    .confirm:active{transform:translateY(2px);box-shadow:0 2px 0 #080e31}
    .error{min-height:1.3em;margin:10px 0 0;color:#a52d35;text-align:center;font-weight:800}
    .missing{max-width:480px;margin:auto;padding:24px;background:#fff8e7;border:2px solid #efbd70;border-radius:12px;text-align:center}
    .missing a{display:inline-block;margin-top:8px;padding:7px 12px;border-radius:8px;background:#ef7b24;color:#fff;text-decoration:none;font-weight:800}
    @media(max-width:600px){body{grid-template-rows:54px 1fr}.topbar{padding-inline:12px}.fox{width:36px;height:36px}main{padding:16px}.mentor-panel{padding:22px 16px}.mentor-grid{grid-template-columns:1fr;gap:9px}.mentor-card{min-height:94px;grid-template-columns:64px minmax(0,1fr) 18px;padding:9px}.mentor-image{width:60px;height:60px}.mentor-copy h2{font-size:1.08rem}.mentor-copy p{font-size:.82rem}.confirm{margin-top:16px}}
    @media(max-width:360px){.back{font-size:.86rem}.heading{margin-bottom:16px}.mentor-copy p{font-size:.77rem}}
    @media(prefers-reduced-motion:reduce){.mentor-card{transition:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="fox" aria-hidden="true"></span><span>STUDY PLAY</span></a>
    <a class="back" href="registro.html">Volver al registro</a>
  </header>
  <main>
    <section class="mentor-panel" id="mentorPanel" aria-labelledby="pageTitle">
      <div class="heading"><h1 id="pageTitle">Elige tu mentor virtual</h1><p class="intro">Tu compañero de IA te guiará en cada paso de tu viaje académico</p></div>
      <form id="mentorForm">
        <div class="mentor-grid" role="radiogroup" aria-label="Selecciona tu mentor">
          <label class="mentor-option mentor-panda">
            <input type="radio" name="mentor" value="panda-zen" required>
            <span class="mentor-card"><span class="mentor-image" aria-hidden="true"></span><span class="mentor-copy"><h2>Panda Zen</h2><p>Calmado y metódico. Perfecto para planificar con detalle</p></span><span class="choice-indicator" aria-hidden="true"></span></span>
          </label>
          <label class="mentor-option mentor-fox">
            <input type="radio" name="mentor" value="zorro-spark" required>
            <span class="mentor-card"><span class="mentor-image"><img src="imagen_oficial_zorro_spark.jpg" alt=""></span><span class="mentor-copy"><h2>Zorro Spark</h2><p>Curioso y veloz. Ideal para explorar nuevos temas</p></span><span class="choice-indicator" aria-hidden="true"></span></span>
          </label>
          <label class="mentor-option mentor-cat">
            <input type="radio" name="mentor" value="gata-luna" required>
            <span class="mentor-card"><span class="mentor-image" aria-hidden="true"></span><span class="mentor-copy"><h2>Gata Luna</h2><p>Creativa e intuitiva. Perfecta para artes y letras</p></span><span class="choice-indicator" aria-hidden="true"></span></span>
          </label>
          <label class="mentor-option mentor-turtle">
            <input type="radio" name="mentor" value="tortuga-sage" required>
            <span class="mentor-card"><span class="mentor-image" aria-hidden="true"></span><span class="mentor-copy"><h2>Tortuga Sage</h2><p>Paciente y constante. Excelente para ciencias exactas</p></span><span class="choice-indicator" aria-hidden="true"></span></span>
          </label>
        </div>
        <p class="error" id="formError" role="alert"></p>
        <button class="confirm" type="submit">Confirmar mentor y comenzar</button>
      </form>
    </section>
    <section class="missing" id="missingRegistration" hidden>
      <h1>Primero crea tu cuenta</h1>
      <p>Completa tus datos para poder guardar tu mentor.</p>
      <a href="registro.html">Ir al registro</a>
    </section>
  </main>
  <script>
    const panel = document.getElementById("mentorPanel");
    const form = document.getElementById("mentorForm");
    let pending = null;

    try {
      pending = JSON.parse(sessionStorage.getItem("studyPlayPendingRegistration") || "null");
    } catch {
      pending = null;
    }

    if (!pending || !pending.nombre || !pending.email) {
      panel.hidden = true;
      document.getElementById("missingRegistration").hidden = false;
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      if (!pending || !form.reportValidity()) return;

      const mentorId = new FormData(form).get("mentor");
      const mentors = {
        "panda-zen": "Panda Zen",
        "zorro-spark": "Zorro Spark",
        "gata-luna": "Gata Luna",
        "tortuga-sage": "Tortuga Sage"
      };
      const user = { ...pending, mentorId, mentorName: mentors[mentorId], nivel: 1, xp: 0, racha: 0 };

      try {
        const accounts = JSON.parse(localStorage.getItem("studyPlayAccounts") || "{}");
        accounts[pending.email.toLowerCase()] = user;
        localStorage.setItem("studyPlayAccounts", JSON.stringify(accounts));
        localStorage.setItem("studyPlayUser", JSON.stringify(user));
        sessionStorage.removeItem("studyPlayPendingRegistration");
        location.href = "index.html";
      } catch {
        document.getElementById("formError").textContent = "No se pudo guardar la cuenta en este navegador.";
      }
    });
  </script>
</body>
</html>
